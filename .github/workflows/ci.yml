name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Non-blocking on purpose. The codebase currently has ~232 pre-existing
      # eslint errors (mostly react-hooks v7 rules), so a blocking lint gate
      # would fail every PR and train everyone to ignore CI. Report it, don't
      # enforce it — flip continue-on-error off once the backlog is cleared.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
      # Dummy values: we only care that the bundle compiles, not what it points at.
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_AWS_URL: https://example.invalid/
