name: Deploy Admin Panel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: kma-admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Vite inlines VITE_* at build time, so these must be present HERE,
      # not on the server. A missing secret produces a silently broken build.
      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AWS_URL: ${{ secrets.VITE_AWS_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::VITE_API_URL secret is not set"; exit 1; }
          test -n "$VITE_AWS_URL" || { echo "::error::VITE_AWS_URL secret is not set"; exit 1; }
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Order matters. Hashed assets go up FIRST so that the moment the new
      # index.html lands, everything it references already exists.
      # No --delete: users mid-session still have the old index.html and would
      # 404 on chunks that were just removed. Stale assets are pruned below.
      - name: Upload assets
        run: |
          aws s3 sync dist s3://$S3_BUCKET \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (never cached)
        run: |
          aws s3 cp dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # patch-payout.js ships from public/ and must NOT be immutably cached —
      # it has no content hash, so a cached copy would never pick up an update.
      - name: Fix cache header on unhashed public assets
        run: |
          aws s3 cp dist/assets/patch-payout.js s3://$S3_BUCKET/assets/patch-payout.js \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/javascript"

      - name: Summary
        run: |
          echo "### Deployed to s3://$S3_BUCKET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- url: http://$S3_BUCKET.s3-website.$AWS_REGION.amazonaws.com" >> $GITHUB_STEP_SUMMARY
